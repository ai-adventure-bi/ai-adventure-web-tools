
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f4f0e5">
<title>Quake Quest — Helicorder</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#f4f0e5;
  font-family:system-ui,-apple-system,sans-serif;
  color:#34332e;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
.controls{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 12px;
  border:1px solid #c9c4b8;
  border-radius:9px;
  background:rgba(250,248,242,.94);
  box-shadow:0 2px 12px #00000012;
  white-space:nowrap;
}
button{
  border:1px solid #c8c2b5;
  background:#fffdf8;
  color:#35332e;
  border-radius:5px;
  padding:9px 13px;
  font:inherit;
  font-size:12px;
  cursor:pointer;
}
button.primary{
  background:#a52b2b;
  color:white;
  border-color:#a52b2b;
}
button:disabled{opacity:.65}
label{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
}
input[type=range]{
  width:100px;
  accent-color:#a52b2b;
}
.status{
  position:fixed;
  bottom:12px;
  left:14px;
  z-index:5;
  padding:6px 9px;
  background:rgba(250,248,242,.85);
  border-radius:4px;
  font-size:11px;
  color:#777267;
  pointer-events:none;
}
.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
  margin-right:6px;
}
.dot.live{background:#4a9765}
.dot.test{background:#d29b36}
@media(max-width:600px){
  .controls{
    top:8px;
    gap:7px;
    padding:7px;
  }
  button{padding:8px;font-size:11px}
  label{font-size:11px}
  input[type=range]{width:65px}
}
</style>
</head>
<body>

<canvas id="paper"></canvas>

<div class="controls">
  <button id="start" class="primary">Start sensors</button>
  <label>
    Sensitivity
    <input id="gain" type="range" min="1" max="30" value="12">
  </label>
  <button id="clear">Clear</button>
</div>

<div class="status">
  <span class="dot" id="dot"></span>
  <span id="status">Waiting for motion sensors</span>
</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("paper");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const clearButton=document.getElementById("clear");
const gain=document.getElementById("gain");
const status=document.getElementById("status");
const dot=document.getElementById("dot");

let W=0,H=0,DPR=1;
let rowHeight=72;
let rows=1;
let row=0;
let x=0;
let previousY=null;

let sensorEnabled=false;
let sensorReceived=false;
let lastSensor=0;
let sensorAttached=false;
let lastGravity=null;
let gravity={x:0,y:0,z:0};
let previousAcceleration=null;

// Seismometer physics.
let target=0;
let position=0;
let velocity=0;

// High-frequency component of movement.
let fastSignal=0;
let previousSignal=0;

// Sensor smoothing and drift correction.
let baseline=0;
let motionInput=0;
let motionEnergy=0;

// Touch simulation.
let touching=false;
let touchX=0;
let touchY=0;
let touchImpulse=0;
let touchMode=false;

// Timing.
let previousFrame=performance.now();
let accumulator=0;
const SPEED=110;

// Paper colours.
const PAPER="#f4f0e5";
const MINOR="#e8dfd3";
const MAJOR="#d9c8b8";
const BASELINE="#dfd0c5";
const INK="#a72d2c";

function setStatus(message,mode=""){
  status.textContent=message;
  dot.className="dot"+(mode?" "+mode:"");
}

function configureCanvas(){
  const old=document.createElement("canvas");
  old.width=canvas.width;
  old.height=canvas.height;

  if(old.width&&old.height){
    old.getContext("2d").drawImage(canvas,0,0);
  }

  W=window.innerWidth;
  H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  rowHeight=Math.max(56,Math.min(86,H/9));
  rows=Math.max(1,Math.floor(H/rowHeight));
  row=Math.min(row,rows-1);
  x=Math.min(x,W-1);

  drawPaper();

  if(old.width&&old.height){
    ctx.drawImage(
      old,
      0,0,old.width,old.height,
      0,0,W,H
    );
  }

  previousY=null;
}

function drawPaper(){
  ctx.fillStyle=PAPER;
  ctx.fillRect(0,0,W,H);

  drawGridRegion(0,0,W,H);
}

function drawGridRegion(left,top,width,height){
  ctx.save();

  ctx.beginPath();
  ctx.rect(left,top,width,height);
  ctx.clip();

  // Fine graph-paper lines.
  ctx.strokeStyle=MINOR;
  ctx.lineWidth=.6;
  ctx.beginPath();

  const small=12;

  for(let gx=Math.floor(left/small)*small;
      gx<=left+width;gx+=small){
    ctx.moveTo(gx+.5,top);
    ctx.lineTo(gx+.5,top+height);
  }

  for(let gy=Math.floor(top/small)*small;
      gy<=top+height;gy+=small){
    ctx.moveTo(left,gy+.5);
    ctx.lineTo(left+width,gy+.5);
  }

  ctx.stroke();

  // Major vertical divisions.
  ctx.strokeStyle=MAJOR;
  ctx.lineWidth=.8;
  ctx.beginPath();

  for(let gx=Math.floor(left/60)*60;
      gx<=left+width;gx+=60){
    ctx.moveTo(gx+.5,top);
    ctx.lineTo(gx+.5,top+height);
  }

  ctx.stroke();

  // Centre line for each recording row.
  ctx.strokeStyle=BASELINE;
  ctx.lineWidth=.7;
  ctx.beginPath();

  for(let r=0;r<rows;r++){
    const cy=r*rowHeight+rowHeight/2;
    if(cy>=top-1&&cy<=top+height+1){
      ctx.moveTo(left,cy);
      ctx.lineTo(left+width,cy);
    }
  }

  ctx.stroke();
  ctx.restore();
}

function eraseRegion(left,top,width,height){
  ctx.fillStyle=PAPER;
  ctx.fillRect(left,top,width,height);
  drawGridRegion(left,top,width,height);
}

function reset(){
  row=0;
  x=0;
  previousY=null;

  position=0;
  velocity=0;
  target=0;
  fastSignal=0;
  previousSignal=0;
  baseline=0;
  motionInput=0;
  motionEnergy=0;
  touchImpulse=0;
  previousAcceleration=null;

  drawPaper();
}

// Obtain signed motion along multiple axes.
// The weighted combination responds to horizontal,
// vertical and rotational movements.
function readMotion(event){
  sensorReceived=true;
  lastSensor=performance.now();

  if(!sensorEnabled){
    sensorEnabled=true;
    start.disabled=true;
    start.textContent="Recording";
    setStatus("LIVE · iPad motion sensors","live");
  }

  let ax=0,ay=0,az=0;
  let hasAcceleration=false;

  const a=event.acceleration;

  if(a&&
    Number.isFinite(a.x)&&
    Number.isFinite(a.y)&&
    Number.isFinite(a.z)){
    ax=a.x;
    ay=a.y;
    az=a.z;
    hasAcceleration=true;
  }

  // Fallback if gravity-free acceleration is absent.
  if(!hasAcceleration){
    const raw=event.accelerationIncludingGravity;

    if(raw&&
      Number.isFinite(raw.x)&&
      Number.isFinite(raw.y)&&
      Number.isFinite(raw.z)){

      if(!lastGravity){
        lastGravity={
          x:raw.x,
          y:raw.y,
          z:raw.z
        };
      }

      const alpha=.035;

      lastGravity.x+=(raw.x-lastGravity.x)*alpha;
      lastGravity.y+=(raw.y-lastGravity.y)*alpha;
      lastGravity.z+=(raw.z-lastGravity.z)*alpha;

      ax=raw.x-lastGravity.x;
      ay=raw.y-lastGravity.y;
      az=raw.z-lastGravity.z;
      hasAcceleration=true;
    }
  }

  // Gyroscope rotation rate.
  const rotation=event.rotationRate;
  let gyro=0;

  if(rotation){
    const rx=Number.isFinite(rotation.alpha)
      ?rotation.alpha:0;
    const ry=Number.isFinite(rotation.beta)
      ?rotation.beta:0;
    const rz=Number.isFinite(rotation.gamma)
      ?rotation.gamma:0;

    gyro=rx*.012+ry*.018+rz*.009;
  }

  if(!hasAcceleration&&!rotation)return;

  // Signed acceleration, not absolute magnitude.
  // All three axes contribute, but the principal
  // horizontal axes dominate.
  const combined=
    ax*.72+
    ay*.48+
    az*.30+
    gyro;

  // Slowly remove steady offsets.
  baseline+=(combined-baseline)*.008;

  const centred=combined-baseline;

  // Emphasise abrupt changes, as a real recording
  // instrument reacts strongly to sudden motion.
  const change=centred-previousSignal;
  previousSignal=centred;

  fastSignal=fastSignal*.42+change*.58;

  motionInput=
    centred*.75+
    fastSignal*1.65;

  motionInput=Math.max(-35,Math.min(35,motionInput));

  motionEnergy+=(Math.abs(motionInput)-motionEnergy)*.12;
}

async function enableSensors(){
  start.disabled=true;
  setStatus("Requesting motion permission...");

  if(!("DeviceMotionEvent" in window)){
    setStatus("No motion sensors · drag the paper to test","test");
    start.disabled=false;
    return;
  }

  try{
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      const permission=await DeviceMotionEvent.requestPermission();

      if(permission!=="granted"){
        setStatus("Motion access denied · touch simulation","test");
        start.disabled=false;
        return;
      }
    }

    if(!sensorAttached){
      window.addEventListener("devicemotion",readMotion);
      sensorAttached=true;
    }

    setStatus("Waiting for motion readings...");

    setTimeout(()=>{
      if(!sensorReceived){
        setStatus("No sensor data · check Safari permissions");
        start.disabled=false;
      }
    },3000);

  }catch(error){
    setStatus("Motion access unavailable · touch simulation","test");
    start.disabled=false;
  }
}

start.addEventListener("click",enableSensors);
clearButton.addEventListener("click",reset);

// Touch or mouse testing.
// A fast movement produces a strong impulse.
canvas.addEventListener("pointerdown",e=>{
  touching=true;
  touchMode=true;
  touchX=e.clientX;
  touchY=e.clientY;
  canvas.setPointerCapture(e.pointerId);

  if(!sensorEnabled){
    setStatus("SIMULATION · drag across the paper","test");
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!touching)return;

  const dx=e.clientX-touchX;
  const dy=e.clientY-touchY;

  touchImpulse+=dx*.16+dy*.22;
  touchImpulse=Math.max(-25,Math.min(25,touchImpulse));

  touchX=e.clientX;
  touchY=e.clientY;
});

function endTouch(){
  touching=false;
}

canvas.addEventListener("pointerup",endTouch);
canvas.addEventListener("pointercancel",endTouch);

// Physical pen model.
// A damped spring responds to acceleration,
// overshoots, oscillates and gradually settles.
function updatePhysics(dt){
  const sensitivity=Number(gain.value);

  let input=sensorEnabled?motionInput:0;

  if(touchMode){
    input+=touchImpulse;
  }

  // Reduce stale input between sensor updates.
  if(performance.now()-lastSensor>100){
    motionInput*=.94;
  }

  touchImpulse*=Math.exp(-dt*13);

  if(!touching&&Math.abs(touchImpulse)<.005){
    touchMode=false;
  }

  // Target position responds to signed acceleration.
  target=input*sensitivity*1.35;

  // Damped spring with realistic overshoot.
  const stiffness=165;
  const damping=13;

  const acceleration=
    (target-position)*stiffness-
    velocity*damping;

  velocity+=acceleration*dt;
  position+=velocity*dt;

  // Mechanical travel limit.
  const limit=rowHeight*.47;

  if(position>limit){
    position=limit;
    velocity=Math.min(0,velocity)*.35;
  }

  if(position< -limit){
    position=-limit;
    velocity=Math.max(0,velocity)*.35;
  }
}

function advanceTrace(){
  const centre=row*rowHeight+rowHeight/2;
  const y=centre-position;

  // Draw continuous fine red ink.
  ctx.strokeStyle=INK;
  ctx.lineWidth=1.15;
  ctx.lineJoin="round";
  ctx.lineCap="round";

  ctx.beginPath();

  if(previousY===null){
    ctx.moveTo(x,y);
  }else{
    ctx.moveTo(x-1,previousY);
    ctx.lineTo(x,y);
  }

  ctx.stroke();

  previousY=y;
  x++;

  if(x>=W){
    x=0;
    row++;
    previousY=null;

    if(row>=rows)row=0;

    // The recording drum has completed one rotation.
    // Only erase the row about to be overwritten.
    eraseRegion(
      0,
      row*rowHeight,
      W,
      rowHeight
    );
  }
}

function frame(now){
  const elapsed=Math.min((now-previousFrame)/1000,.08);
  previousFrame=now;

  // Real sensor connection monitoring.
  if(sensorEnabled&&now-lastSensor>1800){
    sensorEnabled=false;
    start.disabled=false;
    start.textContent="Start sensors";
    setStatus("Sensor signal lost · reconnect");
  }

  // Fixed timestep gives consistent movement
  // regardless of the display refresh rate.
  accumulator+=elapsed;

  const step=1/SPEED;
  let iterations=0;

  while(accumulator>=step&&iterations<15){
    updatePhysics(step);
    advanceTrace();
    accumulator-=step;
    iterations++;
  }

  requestAnimationFrame(frame);
}

window.addEventListener("resize",configureCanvas);

configureCanvas();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
