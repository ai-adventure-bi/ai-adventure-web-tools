
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f2ea">
<title>Quake Quest — Seismograph</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#f5f2ea;
  color:#34332f;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
.controls{
  position:fixed;
  z-index:10;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border:1px solid #d2cdc2;
  border-radius:9px;
  background:rgba(250,249,245,.93);
  box-shadow:0 3px 15px #00000012;
  white-space:nowrap;
}
button{
  font:inherit;
  font-size:12px;
  padding:9px 13px;
  background:#fff;
  border:1px solid #ccc7bc;
  border-radius:5px;
  color:#333;
  cursor:pointer;
}
button.primary{
  background:#aa2929;
  border-color:#aa2929;
  color:#fff;
}
button:disabled{opacity:.5}
label{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
}
input[type=range]{
  width:100px;
  accent-color:#aa2929;
}
.timeline{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  width:min(560px,85vw);
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 14px;
  border-radius:8px;
  border:1px solid #d2cdc2;
  background:rgba(250,249,245,.93);
}
.timeline input{
  flex:1;
  width:100%;
}
.time{
  font-size:11px;
  font-variant-numeric:tabular-nums;
  color:#777;
}
.status{
  position:fixed;
  left:15px;
  bottom:16px;
  z-index:10;
  font-size:11px;
  color:#777;
  background:rgba(250,249,245,.85);
  padding:7px 10px;
  border-radius:5px;
}
@media(max-width:700px){
  .controls{
    top:8px;
    gap:5px;
    padding:6px;
  }
  button{padding:8px;font-size:11px}
  label{font-size:11px}
  label input{width:65px}
  .timeline{bottom:45px}
}


.magnitude{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10;
  min-width:145px;
  padding:13px 17px;
  background:rgba(250,249,245,.94);
  border:1px solid #d2cdc2;
  border-radius:8px;
  text-align:center;
  box-shadow:0 3px 15px #00000010;
  pointer-events:none;
}

.mag-heading{
  font-size:9px;
  font-weight:600;
  letter-spacing:1px;
  color:#817c73;
}

.mag-value{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:5px;
  margin:3px 0;
}

#magNumber{
  font-size:42px;
  font-weight:300;
  letter-spacing:-2px;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
}

.mag-unit{
  font-size:15px;
  color:#999;
}

.mag-description{
  font-size:11px;
  color:#777;
}

@media(max-width:700px){
  .magnitude{
    right:8px;
    bottom:8px;
    min-width:110px;
    padding:9px;
  }

  #magNumber{
    font-size:32px;
  }
}


</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="controls">
  <button id="start" class="primary">Start sensors</button>
  <button id="pause">Pause</button>
  <button id="rewind">Rewind</button>
  <label>
    Sensitivity
    <input id="sensitivity" type="range" min="1" max="50" value="30">
  </label>
  <button id="clear">Clear</button>
</div>

<div class="timeline">
  <span class="time" id="currentTime">0:00</span>
  <input id="scrub" type="range" min="0" max="1000" value="1000">
  <span class="time" id="totalTime">0:00</span>
</div>

<div class="status" id="status">
  Waiting for motion sensors
</div>


<div class="magnitude">
  <div class="mag-heading">SIMULATED MAGNITUDE</div>
  <div class="mag-value">
    <span id="magNumber">0.0</span>
    <span class="mag-unit">M</span>
  </div>
  <div class="mag-description" id="magDescription">
    No movement
  </div>
</div>


<script>
(() => {
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const startBtn=document.getElementById("start");
const pauseBtn=document.getElementById("pause");
const rewindBtn=document.getElementById("rewind");
const clearBtn=document.getElementById("clear");
const sensitivity=document.getElementById("sensitivity");
const scrub=document.getElementById("scrub");
const status=document.getElementById("status");

const magNumber=document.getElementById("magNumber");
const magDescription=document.getElementById("magDescription");

// Magnitude simulation.
// These are educational calibration values,
// not real earthquake magnitude measurements.
const MAG_REFERENCE=0.002;
const MAG_OFFSET=2.0;

let magnitudePeak=0;
let magnitudeLastUpdate=performance.now();
let magnitudeHistory=[];
let magnitudeDisplay=0;

function calculateMagnitude(acceleration){
  const now=performance.now();

  // Store recent acceleration readings.
  magnitudeHistory.push({
    time:now,
    value:Math.abs(acceleration)
  });

  // Keep the last three seconds.
  magnitudeHistory=magnitudeHistory.filter(
    item=>now-item.time<3000
  );

  // Use peak acceleration over that period.
  let peak=0;

  for(const item of magnitudeHistory){
    peak=Math.max(peak,item.value);
  }

  // Logarithmic educational magnitude.
  let magnitude=0;

  if(peak>MAG_REFERENCE){
    magnitude=
      Math.log10(peak/MAG_REFERENCE)+MAG_OFFSET;
  }

  magnitude=Math.max(0,Math.min(9.9,magnitude));

  magnitudeDisplay=magnitude;

  magNumber.textContent=magnitude.toFixed(1);

  let description="No movement";

  if(magnitude>=7){
    description="Major earthquake";
  }else if(magnitude>=6){
    description="Strong earthquake";
  }else if(magnitude>=5){
    description="Moderate earthquake";
  }else if(magnitude>=4){
    description="Light earthquake";
  }else if(magnitude>=2){
    description="Minor earthquake";
  }else if(magnitude>0){
    description="Micro movement";
  }

  magDescription.textContent=description;
}

const currentTime=document.getElementById("currentTime");
const totalTime=document.getElementById("totalTime");

let W=0,H=0,DPR=1;

// Recording settings.
const SAMPLE_RATE=120;
const STEP=1/SAMPLE_RATE;
const PIXELS_PER_SECOND=20;
const MAX_SECONDS=600;
const MAX_SAMPLES=SAMPLE_RATE*MAX_SECONDS;

// Circular recording buffer.
const samples=new Float32Array(MAX_SAMPLES);
let sampleCount=0;
let totalSamples=0;

// Playback.
let paused=false;
let viewingLive=true;
let viewSample=0;

// Physical needle.
let penPosition=0;
let penVelocity=0;
let inputForce=0;
let inputBaseline=0;
let previousInput=0;

// Motion sensors.
let sensorActive=false;
let sensorAttached=false;
let lastSensorTime=0;
let lastGravity=null;
let latestMotion=0;

// Mouse/touch simulation.
let touching=false;
let previousPointer=null;
let pointerImpulse=0;
let simulated=false;

// Timing.
let lastFrame=performance.now();
let accumulator=0;

// Colours.
const PAPER="#f5f2ea";
const GRID="#e4ded3";
const GRID_MAJOR="#d5cabe";
const INK="#b32328";

function resize(){
  W=window.innerWidth;
  H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function setStatus(text){
  status.textContent=text;
}

// Store a recorded needle position.
function record(value){
  samples[totalSamples%MAX_SAMPLES]=value;
  totalSamples++;
  sampleCount=Math.min(totalSamples,MAX_SAMPLES);
  if(viewingLive)viewSample=totalSamples;
}

function getSample(index){
  const oldest=totalSamples-sampleCount;

  if(index<oldest||index>=totalSamples)return 0;

  return samples[index%MAX_SAMPLES];
}

function readMotion(event){
  lastSensorTime=performance.now();

  if(!sensorActive){
    sensorActive=true;
    startBtn.disabled=true;
    startBtn.textContent="Sensors active";
    setStatus("LIVE · iPad motion sensors");
  }

  let ax=0,ay=0,az=0;
  let valid=false;

  const a=event.acceleration;

  if(a&&
     Number.isFinite(a.x)&&
     Number.isFinite(a.y)&&
     Number.isFinite(a.z)){
    ax=a.x;
    ay=a.y;
    az=a.z;
    valid=true;
  }

  if(!valid){
    const raw=event.accelerationIncludingGravity;

    if(raw&&
       Number.isFinite(raw.x)&&
       Number.isFinite(raw.y)&&
       Number.isFinite(raw.z)){

      if(!lastGravity){
        lastGravity={x:raw.x,y:raw.y,z:raw.z};
      }

      const alpha=.025;

      lastGravity.x+=(raw.x-lastGravity.x)*alpha;
      lastGravity.y+=(raw.y-lastGravity.y)*alpha;
      lastGravity.z+=(raw.z-lastGravity.z)*alpha;

      ax=raw.x-lastGravity.x;
      ay=raw.y-lastGravity.y;
      az=raw.z-lastGravity.z;
      valid=true;
    }
  }

  let rotation=0;

  if(event.rotationRate){
    const r=event.rotationRate;

    rotation=
      (Number.isFinite(r.alpha)?r.alpha:0)*.008+
      (Number.isFinite(r.beta)?r.beta:0)*.014+
      (Number.isFinite(r.gamma)?r.gamma:0)*.01;

    valid=true;
  }


  if(!valid)return;

  // Physical acceleration magnitude, independent
  // of visual pen sensitivity.
  const accelerationStrength=Math.hypot(ax,ay,az);

  calculateMagnitude(accelerationStrength);

  // Signed motion rather than magnitude.

  const combined=
    ax*.8+
    ay*.55+
    az*.35+
    rotation;

  // Remove slowly changing bias.
  inputBaseline+=(combined-inputBaseline)*.012;

  const centred=combined-inputBaseline;
  const transient=centred-previousInput;

  previousInput=centred;

  latestMotion=
    centred*.7+
    transient*1.8;

  latestMotion=Math.max(-40,Math.min(40,latestMotion));
}

async function startSensors(){
  startBtn.disabled=true;
  setStatus("Requesting motion permission...");

  if(!("DeviceMotionEvent" in window)){
    setStatus("No motion sensors · drag to simulate");
    startBtn.disabled=false;
    return;
  }

  try{
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      const permission=await DeviceMotionEvent.requestPermission();

      if(permission!=="granted"){
        setStatus("Motion permission denied · drag to simulate");
        startBtn.disabled=false;
        return;
      }
    }

    if(!sensorAttached){
      window.addEventListener("devicemotion",readMotion);
      sensorAttached=true;
    }

    setStatus("Waiting for sensor readings...");

    setTimeout(()=>{
      if(!sensorActive){
        setStatus("No sensor readings received");
        startBtn.disabled=false;
      }
    },3000);

  }catch(error){
    setStatus("Motion access unavailable · drag to simulate");
    startBtn.disabled=false;
  }
}

startBtn.addEventListener("click",startSensors);

// Physical damped spring.
// Motion pushes the needle away from equilibrium.
// The restoring force pulls it back through centre.
function updatePhysics(dt){
  let force=sensorActive?latestMotion:0;

  force+=pointerImpulse;

  // Fade sensor input if no fresh data.
  if(performance.now()-lastSensorTime>100){
    latestMotion*=Math.exp(-dt*15);
  }

  pointerImpulse*=Math.exp(-dt*12);

  const gain=Number(sensitivity.value);

  // Force-driven oscillator.
  const spring=250;
  const damping=9;
  const drive=90;

  const acceleration=
    force*gain*drive-
    spring*penPosition-
    damping*penVelocity;

  penVelocity+=acceleration*dt;
  penPosition+=penVelocity*dt;

  // Mechanical range.
  const limit=H*.43;

  if(penPosition>limit){
    penPosition=limit;
    penVelocity=Math.min(0,penVelocity)*.2;
  }

  if(penPosition< -limit){
    penPosition=-limit;
    penVelocity=Math.max(0,penVelocity)*.2;
  }

  // Recording is continuous, including silence.
  record(penPosition);
}

function drawPaper(){
  ctx.fillStyle=PAPER;
  ctx.fillRect(0,0,W,H);

  const centre=H/2;

  // Horizontal grid, centred around the needle.
  ctx.strokeStyle=GRID;
  ctx.lineWidth=.7;
  ctx.beginPath();

  for(let y=centre%20;y<H;y+=20){
    ctx.moveTo(0,y+.5);
    ctx.lineTo(W,y+.5);
  }

  ctx.stroke();

  // Time grid scrolls with the paper.
  const end=viewSample;
  const seconds=end/SAMPLE_RATE;
  const scroll=seconds*PIXELS_PER_SECOND;

  ctx.strokeStyle=GRID;
  ctx.beginPath();

  for(let x=-(scroll%20);x<W;x+=20){
    ctx.moveTo(x+.5,0);
    ctx.lineTo(x+.5,H);
  }

  ctx.stroke();

  ctx.strokeStyle=GRID_MAJOR;
  ctx.lineWidth=1;
  ctx.beginPath();

  for(let x=-(scroll%100);x<W;x+=100){
    ctx.moveTo(x+.5,0);
    ctx.lineTo(x+.5,H);
  }

  for(let y=centre%100;y<H;y+=100){
    ctx.moveTo(0,y+.5);
    ctx.lineTo(W,y+.5);
  }

  ctx.stroke();

  // Central resting position.
  ctx.strokeStyle="#d5bdb7";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,centre);
  ctx.lineTo(W,centre);
  ctx.stroke();
}

function drawTrace(){
  const centre=H/2;

  // Fixed pen near right edge.
  const penX=W*.87;

  const samplesPerPixel=SAMPLE_RATE/PIXELS_PER_SECOND;

  const oldest=totalSamples-sampleCount;
  const end=Math.min(viewSample,totalSamples);
  const start=Math.max(
    oldest,
    Math.floor(end-penX*samplesPerPixel)
  );

  ctx.strokeStyle=INK;
  ctx.lineWidth=1.35;
  ctx.lineJoin="round";
  ctx.lineCap="round";
  ctx.beginPath();

  let first=true;

  for(let i=start;i<end;i++){
    const x=penX-(end-i)/samplesPerPixel;
    const y=centre-getSample(i);

    if(first){
      ctx.moveTo(x,y);
      first=false;
    }else{
      ctx.lineTo(x,y);
    }
  }

  if(!first)ctx.stroke();

  // Draw pen and its shadow.
  const penY=centre-getSample(Math.max(oldest,end-1));

  // Pen support arm.
  ctx.strokeStyle="#77746f";
  ctx.lineWidth=5;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(W+25,penY-95);
  ctx.lineTo(penX+26,penY-12);
  ctx.stroke();

  // Metal needle.
  ctx.strokeStyle="#c5c5c2";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(penX+26,penY-12);
  ctx.lineTo(penX,penY);
  ctx.stroke();

  // Needle tip.
  ctx.fillStyle="#5b5551";
  ctx.beginPath();
  ctx.arc(penX,penY,3,0,Math.PI*2);
  ctx.fill();

  // Red ink point.
  ctx.fillStyle=INK;
  ctx.beginPath();
  ctx.arc(penX,penY,1.6,0,Math.PI*2);
  ctx.fill();
}

function formatTime(seconds){
  const m=Math.floor(seconds/60);
  const s=Math.floor(seconds%60);
  return m+":"+String(s).padStart(2,"0");
}

function updateTimeline(){
  const oldest=totalSamples-sampleCount;
  const range=Math.max(1,totalSamples-oldest);

  if(viewingLive){
    scrub.value=1000;
  }else{
    scrub.value=Math.round(
      ((viewSample-oldest)/range)*1000
    );
  }

  currentTime.textContent=formatTime(viewSample/SAMPLE_RATE);
  totalTime.textContent=formatTime(totalSamples/SAMPLE_RATE);
}

function render(){
  drawPaper();
  drawTrace();
  updateTimeline();
}

// Pause freezes the recording and display.
// Resume continues recording live.
pauseBtn.addEventListener("click",()=>{
  paused=!paused;

  pauseBtn.textContent=paused?"Resume":"Pause";

  if(!paused){
    viewingLive=true;
    viewSample=totalSamples;
  }
});

// Rewind to the beginning of retained recording.
rewindBtn.addEventListener("click",()=>{
  paused=true;
  viewingLive=false;

  pauseBtn.textContent="Resume";

  viewSample=totalSamples-sampleCount;
});

// Timeline scrubbing.
scrub.addEventListener("input",()=>{
  paused=true;
  viewingLive=false;

  pauseBtn.textContent="Resume";

  const oldest=totalSamples-sampleCount;
  const fraction=Number(scrub.value)/1000;

  viewSample=Math.floor(
    oldest+fraction*sampleCount
  );
});

// Clear recording.
clearBtn.addEventListener("click",()=>{
  totalSamples=0;
  sampleCount=0;
  viewSample=0;
  viewingLive=true;
  paused=false;

  penPosition=0;
  penVelocity=0;
  latestMotion=0;
  pointerImpulse=0;
  previousInput=0;
  inputBaseline=0;
  lastGravity=null;

  pauseBtn.textContent="Pause";
});

// Touch simulation.
canvas.addEventListener("pointerdown",e=>{
  touching=true;
  simulated=true;

  previousPointer={x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);

  if(!sensorActive){
    setStatus("SIMULATION · mouse/touch movement");
  }
});

canvas.addEventListener("pointermove",e=>{
  if(!touching||!previousPointer)return;

  const dx=e.clientX-previousPointer.x;
  const dy=e.clientY-previousPointer.y;

  
  pointerImpulse+=dx*.045+dy*.08;
  pointerImpulse=Math.max(-12,Math.min(12,pointerImpulse));

  // Simulate acceleration for the magnitude display
  // when testing with a mouse or touchscreen.
  if(!sensorActive){
    const simulatedAcceleration=Math.hypot(dx,dy)*0.025;
    calculateMagnitude(simulatedAcceleration);
  }


  previousPointer={x:e.clientX,y:e.clientY};
});

function stopPointer(){
  touching=false;
  previousPointer=null;
}

canvas.addEventListener("pointerup",stopPointer);
canvas.addEventListener("pointercancel",stopPointer);

function animate(now){
  const elapsed=Math.min((now-lastFrame)/1000,.08);
  lastFrame=now;

  if(sensorActive&&now-lastSensorTime>2000){
    sensorActive=false;
    startBtn.disabled=false;
    startBtn.textContent="Start sensors";
    setStatus("Sensor signal lost · reconnect");
  }

  if(!paused){
    accumulator+=elapsed;

    let iterations=0;

    while(accumulator>=STEP&&iterations<15){
      updatePhysics(STEP);
      accumulator-=STEP;
      iterations++;
    }
  }else{
    accumulator=0;
  }

  
  // Remove readings older than three seconds.
  magnitudeHistory=magnitudeHistory.filter(
    item=>now-item.time<3000
  );

  // Update magnitude even when stationary.
  const peak=magnitudeHistory.reduce(
    (max,item)=>Math.max(max,item.value),0
  );

  const magnitude=peak>MAG_REFERENCE
    ?Math.max(0,Math.min(9.9,
        Math.log10(peak/MAG_REFERENCE)+MAG_OFFSET
      ))
    :0;

  magNumber.textContent=magnitude.toFixed(1);

  if(magnitude>=7){
    magDescription.textContent="Major earthquake";
  }else if(magnitude>=6){
    magDescription.textContent="Strong earthquake";
  }else if(magnitude>=5){
    magDescription.textContent="Moderate earthquake";
  }else if(magnitude>=4){
    magDescription.textContent="Light earthquake";
  }else if(magnitude>=2){
    magDescription.textContent="Minor earthquake";
  }else if(magnitude>0){
    magDescription.textContent="Micro movement";
  }else{
    magDescription.textContent="No movement";
  }

  render();
  requestAnimationFrame(animate);

}

window.addEventListener("resize",resize);

resize();
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
