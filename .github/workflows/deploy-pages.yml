name: Build website and refresh Quake Quest

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quake-quest/package-lock.json
      - name: Refresh BGS snapshot
        working-directory: quake-quest
        run: node scripts/update-snapshot.mjs
      - name: Install Quake Quest
        working-directory: quake-quest
        run: npm ci
      - name: Build static Quake Quest
        working-directory: quake-quest
        run: npm run build
      - name: Assemble website
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git/ \
            --exclude .github/ \
            --exclude _site/ \
            --exclude quake-quest/ \
            --exclude '**/node_modules/' \
            --exclude '**/.next/' \
            --exclude '**/dist/' \
            --exclude '**/.vinext/' \
            --exclude '**/.wrangler/'
          mkdir -p _site/quake-quest
          test -f quake-quest/dist/client/index.html
          cp -R quake-quest/dist/client/. _site/quake-quest/
          prefixed_assets="_site/quake-quest/ai-adventure-web-tools/quake-quest"
          if [ -d "$prefixed_assets" ]; then
            cp -R "$prefixed_assets"/. _site/quake-quest/
            rm -rf _site/quake-quest/ai-adventure-web-tools
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
