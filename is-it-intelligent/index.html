<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive video gallery exploring intelligence.">
  <title>Is it intelligent?</title>
  <style>
    :root {
      --ink: #17324a;
      --blue: #2d7da8;
      --aqua: #dff5f1;
      --paper: #fbfcf7;
      --coral: #f26f63;
      --shadow: 0 14px 30px rgba(27, 61, 82, .13);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 8% 3%, rgba(223, 245, 241, .9), transparent 25rem),
        var(--paper);
    }
    .page { width: min(1400px, calc(100% - 20px)); margin: 0 auto; padding: 54px 0 72px; }
    header { text-align: center; margin: 0 auto 42px; max-width: 680px; }
    h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.65rem, 7vw, 5rem);
      font-weight: 700;
      line-height: .95;
      letter-spacing: -.06em;
      color: var(--ink);
    }
    .underline { width: 86px; height: 6px; margin: 22px auto 18px; border-radius: 99px; background: var(--coral); }
    header p { margin: 0; font-size: 1.05rem; line-height: 1.55; color: #4c6678; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 28px;
    }
    .video-card {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      background: #d5e2e6;
      box-shadow: var(--shadow);
      isolation: isolate;
      transition: transform .28s ease, box-shadow .28s ease;
    }
    .video-card img, .video-card video { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .32s ease; }
    .video-card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 38%, rgba(14, 37, 52, .84) 100%);
      opacity: .72;
      transition: opacity .28s ease;
    }
    .play-icon {
      position: absolute; z-index: 1; top: 50%; left: 50%;
      display: grid; place-items: center;
      width: 54px; height: 54px; border-radius: 50%;
      color: white; background: rgba(23, 50, 74, .8); border: 2px solid rgba(255,255,255,.9);
      transform: translate(-50%, -50%); transition: transform .28s ease, background .28s ease;
    }
    .play-icon::before { content: ''; margin-left: 4px; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 14px solid currentColor; }
    .card-title {
      position: absolute; z-index: 1; right: 22px; bottom: 17px; left: 22px;
      color: #fff; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.25rem, 2.2vw, 1.8rem); font-weight: bold;
      text-align: centre; line-height: 1.1; opacity: 0; transform: translateY(10px); transition: opacity .25s ease, transform .25s ease;
    }
    .video-card:hover, .video-card:focus-visible { transform: scale(1.025); box-shadow: 0 20px 42px rgba(27, 61, 82, .22); z-index: 1; outline: none; }
    .video-card:hover img, .video-card:hover video, .video-card:focus-visible img, .video-card:focus-visible video { transform: scale(1.035); }
    .video-card:hover::after, .video-card:focus-visible::after { opacity: 1; }
    .video-card:hover .card-title, .video-card:focus-visible .card-title { opacity: 1; transform: translateY(0); }
    .video-card:hover .play-icon, .video-card:focus-visible .play-icon { transform: translate(-50%, -50%) scale(1.08); background: var(--coral); }

    .modal[hidden] { display: none; }
    .modal { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(13, 31, 43, .78); }
    .modal__dialog { position: relative; width: min(100%, 1000px); background: #102c40; border-radius: 16px; box-shadow: 0 28px 70px rgba(0, 0, 0, .38); }
    .modal video { display: block; width: 100%; max-height: calc(100vh - 100px); border-radius: 16px; background: #000; }
    .modal__close {
      position: absolute; z-index: 1; right: -13px; top: -13px; width: 42px; height: 42px; border: 0; border-radius: 50%;
      color: var(--ink); font-size: 29px; line-height: 1; cursor: pointer; background: white; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }
    .modal__close:hover, .modal__close:focus-visible { color: white; background: var(--coral); outline: 3px solid #fff; }
    .modal__caption { padding: 14px 20px 4px; color: white; font-family: Georgia, 'Times New Roman', serif; font-size: 1.2rem; }
    .modal__description { margin: 0; padding: 5px 20px 18px; color: #d7e6ec; line-height: 1.45; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 620px) {
      .page { width: min(100% - 28px, 560px); padding-top: 36px; }
      header { margin-bottom: 30px; }
      .video-grid { grid-template-columns: 1fr; gap: 20px; }
      .modal { padding: 14px; }
      .modal__close { right: 7px; top: 7px; }
      .card-title { opacity: 1; transform: none; font-size: 1.3rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Is it intelligent?</h1>
      <div class="underline"></div>
      <p>Intelligence means the mental ability to learn, reason, understand, solve problems, and adapt to new situations. What do you think?</p>
    </header>

    <!--
      CUSTOMISE THE VIDEOS BELOW:
      1. Put your video files in a videos/ folder beside this HTML file.
      2. Replace each data-video path, video src, title, and description below.
      The cards automatically show the first available frame from each video.
      Common browser-friendly formats include .mp4, .webm, and .ogv.
    -->
    <section class="video-grid" aria-label="Video gallery">
      <button class="video-card" type="button" aria-label="Open Video title one" data-video="videos/calculator.mp4" data-title="Calculator" data-description="A calculator follows mathematical rules to work out answers extremely quickly, even when the calculation is very large.">
        <video src="videos/calculator.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Calculator</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title two" data-video="videos/automaticdoors.mp4" data-title="Automatic Doors" data-description="Automatic doors use a sensor to detect when a person is nearby, triggering it to open or close at the right time.">
        <video src="videos/automaticdoors.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Automatic Doors</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title three" data-video="videos/slimemould.mp4" data-title="Slime Mould" data-description="Slime mould can spread through an area to find food and often forms efficient routes between different places.">
        <video src="videos/slimemould.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Slime Mould</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title four" data-video="videos/dog.mp4" data-title="Dog" data-description="Dogs can learn routines, respond to words and gestures, and change their behaviour depending on people, places, and experiences. They also feel emotions such as joy and sadness, and can even detect and respond to human emotions.">
        <video src="videos/dog.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Dog</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title five" data-video="videos/cleaningrobot.mp4" data-title="Cleaning Robot" data-description="Supermarket cleaning robots use sensors and navigation data to travel around the shop. They avoid people and obstacles as they move around automatically, cleaning the floor as they go.">
        <video src="videos/cleaningrobot.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Cleaning Robot</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title six" data-video="videos/kungfurobot.mp4" data-title="Kung Fu Robots" data-description="These humanoid robots use AI reinforcement learning and physics-based simulations to achieve dynamic balance and whole-body coordination.">
        <video src="videos/kungfurobot.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Kung Fu Robots</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title seven" data-video="videos/fireants.mp4" data-title="Fire Ants" data-description="Fire ants can link together to form bridges, rafts, and other shapes to help the colony survive and navigate dangerous environments.">
        <video src="videos/fireants.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Fire Ants</span>
      </button>
      <button class="video-card" type="button" aria-label="Open Video title eight" data-video="videos/trafficlights.mp4" data-title="Traffic Lights" data-description="Traffic lights use sensors, cameras, and timing systems to detect vehicles and decide when to change.">
        <video src="videos/trafficlights.mp4" muted preload="metadata" playsinline aria-hidden="true"></video>
        <span class="play-icon" aria-hidden="true"></span><span class="card-title">Traffic Lights</span>
      </button>
    </section>
  </main>

  <div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__dialog">
      <button class="modal__close" type="button" aria-label="Close video">&times;</button>
      <video id="modal-video" controls autoplay loop muted playsinline>
        Your browser does not support HTML5 video.
      </video>
      <div class="modal__caption" id="modal-title"></div>
      <p class="modal__description" id="modal-description"></p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('video-modal');
    const player = document.getElementById('modal-video');
    const caption = document.getElementById('modal-title');
    const description = document.getElementById('modal-description');
    const closeButton = modal.querySelector('.modal__close');
    let opener;

    function openVideo(card) {
      opener = card;
      player.src = card.dataset.video; // Change data-video above to point at your local file.
      caption.textContent = card.dataset.title;
      description.textContent = card.dataset.description;
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      closeButton.focus();
      player.play().catch(() => {}); // Playback may wait for a user gesture in some browsers.
    }
    function closeVideo() {
      player.pause();
      player.removeAttribute('src');
      player.load();
      modal.hidden = true;
      document.body.style.overflow = '';
      opener?.focus();
    }

    document.querySelectorAll('.video-card').forEach(card => card.addEventListener('click', () => openVideo(card)));
    closeButton.addEventListener('click', closeVideo);
    modal.addEventListener('click', event => { if (event.target === modal) closeVideo(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modal.hidden) closeVideo(); });
  </script>
</body>
</html>
